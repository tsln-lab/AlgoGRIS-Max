name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The AlgoGRIS commit to build against. c85d58b is AlgoGRIS main as of 2026-09.
  ALGOGRIS_REPOSITORY: GRIS-UdeM/AlgoGRIS
  ALGOGRIS_REF: c85d58b13e2df69f194eec7eca65816b0aa38000

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2025
            configure: -A x64 # newest Visual Studio on the runner
          - name: macOS
            os: macos-15
            configure: -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out AlgoGRIS-Max
        uses: actions/checkout@v7
        with:
          path: AlgoGRIS-Max
          submodules: recursive
          fetch-depth: 0 # tags: the package version comes from git describe

      - name: Check out AlgoGRIS
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ALGOGRIS_REPOSITORY }}
          ref: ${{ env.ALGOGRIS_REF }}
          path: AlgoGRIS

      # AlgoGRIS's .gitmodules use SSH URLs, which need a GitHub SSH key. The repos are public.
      - name: Fetch AlgoGRIS submodules over HTTPS
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git -C AlgoGRIS submodule update --init --recursive

      - name: Configure
        run: cmake -S AlgoGRIS-Max -B build ${{ matrix.configure }}

      - name: Build
        run: cmake --build build --config Release --target algogris_tilde --parallel

      - name: Upload Windows external
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: externals-windows
          path: AlgoGRIS-Max/externals/

      # The package files are generated by the configure step; any one platform's copy will do.
      - name: Upload package files
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: package-files
          path: |
            AlgoGRIS-Max/help/
            AlgoGRIS-Max/setups/
            AlgoGRIS-Max/support/
            AlgoGRIS-Max/package-info.json
            AlgoGRIS-Max/README.md
            AlgoGRIS-Max/LICENSE

      # tar keeps the .mxo bundle's permissions and code signature intact.
      - name: Archive macOS external
        if: runner.os == 'macOS'
        run: tar -czf externals-macos.tar.gz -C AlgoGRIS-Max externals

      - name: Upload macOS external
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          path: externals-macos.tar.gz
          archive: false

  package:
    name: Package
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # for attaching the package to a release

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble the Max package
        id: package
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_REF_NAME//\//-}-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          name="AlgoGRIS-Max-${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "zip=${name}.zip" >> "$GITHUB_OUTPUT"

          test -f artifacts/package-info.json || { echo "::error::No package files: the Windows build failed."; exit 1; }
          mkdir -p AlgoGRIS-Max/externals
          mv artifacts/help artifacts/setups artifacts/support \
             artifacts/package-info.json artifacts/README.md artifacts/LICENSE AlgoGRIS-Max/

          missing=""
          if [ -f "artifacts/algogris~.mxe64" ]; then
            mv "artifacts/algogris~.mxe64" AlgoGRIS-Max/externals/
          else
            missing="Windows"
          fi
          if [ -f artifacts/externals-macos.tar.gz ]; then
            tar -xzf artifacts/externals-macos.tar.gz -C AlgoGRIS-Max
          else
            missing="${missing:+$missing and }macOS"
          fi
          if [ -n "$missing" ]; then
            # A release must carry both platforms; other builds may go one-sided.
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              echo "::error::Refusing to release without the $missing external."
              exit 1
            fi
            echo "::warning::No $missing external in this package."
          fi

          find AlgoGRIS-Max/externals -maxdepth 1
          zip -qry "${name}.zip" AlgoGRIS-Max
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          cat "${name}.zip.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.zip }}
          archive: false

      - name: Publish the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: AlgoGRIS-Max ${{ steps.package.outputs.version }}
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          generate_release_notes: true
          prerelease: ${{ contains(steps.package.outputs.version, '-') }}
          body: |
            A Max package with `algogris~`, the SpatGRIS spatialization algorithms (VBAP, MBAP, hybrid,
            binaural) from [AlgoGRIS](https://github.com/GRIS-UdeM/AlgoGRIS), built for Windows and macOS.

            **Install:** unzip `${{ steps.package.outputs.zip }}` into your Max `Packages` folder
            (`Documents/Max 9/Packages`), then restart Max and open the `algogris~` help patcher.

            **macOS:** the external is signed ad-hoc, not notarized by Apple. After unzipping, run
            `xattr -dr com.apple.quarantine "<Packages>/AlgoGRIS-Max"` once, or macOS will refuse to load it.

            Built against AlgoGRIS `${{ env.ALGOGRIS_REF }}`. Licensed GPL-3.0-or-later.
